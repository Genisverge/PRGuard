services:
  api:
    build: .
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    environment:
      PRGUARD_MODEL: ${PRGUARD_MODEL:?Export PRGUARD_MODEL first}
      OLLAMA_HOST: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app:ro
    ports:
      - "127.0.0.1:8000:8000"

  ui:
    build: .
    command: streamlit run app/ui.py --server.address 0.0.0.0 --server.port 8501
    environment:
      API_URL: http://api:8000
    volumes:
      - .:/app:ro
    depends_on:
      - api
    ports:
      - "127.0.0.1:8501:8501"
